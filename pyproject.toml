[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-residual"
version = "0.2.0"
description = "Evaluation harness for coding and terminal agents inheriting failed task states"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "harbor==0.21.0+residual.1",
  "openai==2.24.0",
  "litellm==1.93.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[project.scripts]
swe-residual = "swe_residual.run:main"
swe-residual-summarize = "swe_residual.metrics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.format]
line-ending = "lf"
